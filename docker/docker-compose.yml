services:
  eng-ged:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: eng-ged:latest
    container_name: eng-ged
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3010:8080"
    volumes:
      - eng_ged_data:/data

volumes:
  eng_ged_data:
